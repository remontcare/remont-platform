<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title id="pageTitle">Home Services | Remont India</title>
<meta name="description" id="pageDesc" content="Book verified home service professionals with Remont India — real prices, instant booking." />
<link rel="canonical" id="pageCanonical" href="https://www.remontindia.com/services" />
<meta name="robots" id="pageRobots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Remont India" />
<meta property="og:title" id="ogTitle" content="Home Services | Remont India" />
<meta property="og:description" id="ogDesc" content="Book verified home service professionals with Remont India." />
<meta property="og:url" id="ogUrl" content="https://www.remontindia.com/services" />
<meta property="og:image" id="ogImage" content="https://www.remontindia.com/icon-512.png" />
<meta property="og:locale" content="en_IN" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" id="twTitle" content="Home Services | Remont India" />
<meta name="twitter:description" id="twDesc" content="Book verified home service professionals with Remont India." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet" />
<style>
:root{--cream:#F5F0E8;--ivory:#FDFAF5;--charcoal:#1A1A1A;--graphite:#2D2D2D;--sienna:#C4601A;--amber:#E8A650;--sage:#6B7C5E;--mist:#E8E3DA;--white:#FFFFFF;--txt-muted:#6E6860;--radius:12px;--ff-display:"Cormorant Garamond",Georgia,serif;--ff-body:"DM Sans",sans-serif;--ff-accent:"Bebas Neue",sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--ff-body);background:var(--ivory);color:var(--charcoal);line-height:1.6;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
@media(min-width:700px){.wrap{padding:0 24px}}
header.site{background:var(--charcoal);color:#fff;padding:14px 0;position:sticky;top:0;z-index:100}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr-left{display:flex;align-items:center;gap:10px;min-width:0}
.back{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:20px;cursor:pointer;flex:0 0 auto}
.brand{font-family:var(--ff-accent);font-size:22px;letter-spacing:.5px;color:#fff;white-space:nowrap}
.brand span{color:var(--amber)}
.hdr-right{display:flex;align-items:center;gap:10px}
.cart-link{position:relative;color:#fff;font-size:20px;display:inline-flex;width:40px;height:40px;align-items:center;justify-content:center}
.cart-link .badge{position:absolute;top:-2px;right:-4px;background:var(--sienna);color:#fff;font-size:10px;font-weight:700;border-radius:100px;padding:2px 6px;min-width:16px;text-align:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:100px;font-weight:600;font-size:13px;background:var(--sienna);color:#fff}
@media(max-width:420px){.btn .lbl{display:none}}
nav.crumbs{font-size:12.5px;color:var(--txt-muted);padding:14px 0 0}
nav.crumbs a{color:var(--sienna)}
.nf{padding:60px 0;text-align:center}
.nf h1{font-family:var(--ff-display);font-size:32px;margin-bottom:10px}
.nf p{color:var(--txt-muted)}
.nf .btn{margin-top:18px;font-size:14px;padding:12px 22px}
footer.site{background:var(--charcoal);color:rgba(255,255,255,.65);padding:28px 0;margin-top:40px;font-size:13px;text-align:center}
footer.site a{color:var(--amber)}
</style>
<meta name="theme-color" content="#1D4ED8" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Remont" />
<link rel="icon" href="/icon-192.png" type="image/png" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="/shared/app-shell.css" />
<link rel="stylesheet" href="/shared/category-live.css" />
<script src="/shared/cart-sync.js"></script>
<script src="/shared/catalog-variants.js"></script>
<script src="/shared/category-live.js"></script>
<script src="/shared/app-shell.js" defer></script>
<script src="/shared/remont-attribution.js" defer></script>
</head>
<body>
<header class="site">
  <div class="wrap">
    <div class="hdr-left">
      <button type="button" class="back" id="cpBack" aria-label="Back">←</button>
      <a href="/" class="brand">Remont <span>India</span></a>
    </div>
    <div class="hdr-right">
      <a href="/?open=cart" class="cart-link" aria-label="Cart">🛒<span class="badge" id="cpBadge" hidden>0</span></a>
      <a href="https://wa.me/919232071064?text=Hi%20Remont%2C%20I%20need%20a%20service" target="_blank" rel="noopener" class="btn">💬<span class="lbl"> WhatsApp</span></a>
    </div>
  </div>
</header>

<main class="wrap">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="/">Home</a> / <a href="/services">Services</a> / <span id="cpCrumb">…</span></nav>
  <div id="cpLive"></div>
  <div id="cpNotFound" class="nf" hidden>
    <h1>We couldn’t find that service</h1>
    <p id="cpNfText">The page may have moved. Here are the closest matches:</p>
    <div class="cl-choices" id="cpChoices" style="justify-content:center"></div>
    <a class="btn" href="/services">Browse all services</a>
  </div>
</main>

<footer class="site"><div class="wrap">
  <p>© 2026 Remont India Pvt. Ltd. · <a href="/">Home</a> · <a href="/services">All Services</a> · <a href="/about">About</a> · <a href="/contact">Contact</a></p>
</div></footer>

<script>
(function () {
  'use strict';
  var ORIGIN = 'https://www.remontindia.com';
  function slugFromUrl() {
    var m = window.location.pathname.match(/\/services\/([^\/?#]+)/);
    var s = m && m[1] !== 'category' ? m[1] : new URLSearchParams(window.location.search).get('slug');
    try { return decodeURIComponent(s || ''); } catch (e) { return s || ''; }
  }
  function setMeta(id, attr, val) { var el = document.getElementById(id); if (el) el.setAttribute(attr, val); }
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

  function badge() {
    var n = 0;
    try { n = JSON.parse(localStorage.getItem('remont_cart') || '[]').reduce(function (t, i) { return t + (i.qty || 1); }, 0); } catch (e) {}
    var b = document.getElementById('cpBadge');
    b.textContent = n > 9 ? '9+' : String(n);
    b.hidden = !n;
  }
  badge();
  window.addEventListener('storage', badge);
  document.getElementById('cpLive').addEventListener('click', function () { setTimeout(badge, 0); });

  document.getElementById('cpBack').addEventListener('click', function () {
    var sameSite = document.referrer && document.referrer.indexOf(window.location.origin) === 0;
    if (sameSite && window.history.length > 1) window.history.back(); else window.location.href = '/';
  });

  function applySeo(page) {
    var c = page.category;
    var url = ORIGIN + '/services/' + page.canonicalSlug;
    var title = c.seoTitle || (c.name + ' Services — Prices & Booking | Remont India');
    var prices = page.services.map(function (s) { return Number(s.basePrice) || 0; }).filter(function (x) { return x > 0; });
    var desc = c.seoDesc || c.description ||
      ('Book ' + c.name + ' with verified professionals on Remont India — ' + page.services.length + ' services' + (prices.length ? ' from ₹' + Math.min.apply(null, prices).toLocaleString('en-IN') : '') + ', transparent prices and instant booking.');
    desc = String(desc).slice(0, 300);
    document.title = title;
    document.getElementById('cpCrumb').textContent = c.name;
    setMeta('pageDesc', 'content', desc);
    setMeta('pageCanonical', 'href', url);
    setMeta('ogTitle', 'content', title); setMeta('twTitle', 'content', title);
    setMeta('ogDesc', 'content', desc); setMeta('twDesc', 'content', desc);
    setMeta('ogUrl', 'content', url);
    if (c.imageUrl) setMeta('ogImage', 'content', c.imageUrl);
    var ld = { '@context': 'https://schema.org', '@graph': [
      { '@type': 'Service', '@id': url + '#service', serviceType: c.name, name: c.name + ' — Remont India', description: desc, url: url,
        provider: { '@type': 'Organization', name: 'Remont India', url: ORIGIN + '/' },
        hasOfferCatalog: { '@type': 'OfferCatalog', name: c.name + ' services', itemListElement: page.services.filter(function (s) { return Number(s.basePrice) > 0; }).slice(0, 50).map(function (s) {
          return { '@type': 'Offer', price: Number(s.basePrice), priceCurrency: 'INR', availability: 'https://schema.org/InStock', itemOffered: { '@type': 'Service', name: s.name } };
        }) } },
      { '@type': 'BreadcrumbList', itemListElement: [
        { '@type': 'ListItem', position: 1, name: 'Home', item: ORIGIN + '/' },
        { '@type': 'ListItem', position: 2, name: 'Services', item: ORIGIN + '/services' },
        { '@type': 'ListItem', position: 3, name: c.name, item: url }] },
    ] };
    var s = document.createElement('script');
    s.type = 'application/ld+json';
    s.textContent = JSON.stringify(ld);
    document.head.appendChild(s);
  }

  function notFound(slug) {
    document.title = 'Service not found | Remont India';
    setMeta('pageRobots', 'content', 'noindex, follow');
    document.getElementById('cpCrumb').textContent = 'Not found';
    document.getElementById('cpNotFound').hidden = false;
    // Closest real categories for whatever was typed ("/services/plumbr-near-me").
    fetch('/api/v1/services/discover?q=' + encodeURIComponent(slug.replace(/[-_]+/g, ' '))).then(function (r) { return r.json(); }).then(function (j) {
      var d = j && j.data && !j.categories ? j.data : j;
      var list = (d && d.categories) || [];
      if (!list.length) { document.getElementById('cpNfText').textContent = 'The page may have moved or the link is incorrect.'; return; }
      document.getElementById('cpChoices').innerHTML = list.slice(0, 4).map(function (c) { return '<a href="' + esc(c.url) + '">' + esc(c.name) + '</a>'; }).join('');
    }).catch(function () {});
  }

  var slug = slugFromUrl();
  if (!slug) { notFound(''); return; }
  RemontCategoryLive.mount(document.getElementById('cpLive'), { slug: slug, full: true, onLoad: applySeo, onNotFound: notFound });
})();
</script>
</body>
</html>
