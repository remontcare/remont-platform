<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Remont Admin — Master Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="sidebar-mount"></div>
<div class="main">
  <div class="topbar">
    <div class="topbar-left"><h1>Master Orders</h1><p>One cart, one checkout, one order number — with its child order breakdown by category and seller</p></div>
    <div class="topbar-right">
      <span class="admin-chip">👤 <span id="admin-name"></span></span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>
  <div class="content">
    <div class="card">
      <div class="card-header" style="flex-wrap:wrap;gap:8px">
        <span class="card-title">All Master Orders</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <input id="filter-q" class="form-control" style="width:220px" placeholder="Search order #, name, phone…" oninput="load()">
          <select id="filter-status" class="form-control" style="width:180px" onchange="load()">
            <option value="">All Statuses</option>
            <option>PENDING_PAYMENT</option><option>CONFIRMED</option>
            <option>COMPLETED</option><option>CANCELLED</option><option>REFUNDED</option>
          </select>
          <button class="btn btn-outline btn-sm" onclick="load()">↺ Refresh</button>
        </div>
      </div>
      <div class="table-wrap"><div id="tbl" class="loading">Loading…</div></div>
    </div>
  </div>
</div>

<div id="detail-overlay" class="overlay" style="display:none">
  <div class="modal" style="max-width:720px">
    <div class="modal-header">
      <span class="modal-title">Master Order <span id="d-number"></span></span>
      <button class="modal-close" onclick="closeModal('detail-overlay')">×</button>
    </div>
    <div id="d-body">Loading…</div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('detail-overlay')">Close</button>
    </div>
  </div>
</div>

<script src="./common.js"></script>
<script>
renderSidebar('master-orders');
requireAuth();

var PROGRESS_COLORS = {
  PENDING_PAYMENT: 'yellow', CONFIRMED: 'blue', IN_PROGRESS: 'purple',
  PARTIALLY_COMPLETED: 'orange', COMPLETED: 'green', CANCELLED: 'red',
};
var PROGRESS_LABELS = {
  PENDING_PAYMENT: 'Pending Payment', CONFIRMED: 'Confirmed', IN_PROGRESS: 'In Progress',
  PARTIALLY_COMPLETED: 'Partially Completed', COMPLETED: 'Completed', CANCELLED: 'Cancelled',
};

function load() {
  var q = document.getElementById('filter-q').value;
  var status = document.getElementById('filter-status').value;
  var p = ['limit=100'];
  if (q) p.push('q=' + encodeURIComponent(q));
  if (status) p.push('status=' + encodeURIComponent(status));
  document.getElementById('tbl').innerHTML = '<div class="loading">Loading…</div>';
  api('GET', '/admin/master-orders?' + p.join('&')).then(function(orders) {
    if (!orders || !orders.length) { document.getElementById('tbl').innerHTML = '<div class="empty-state"><div class="empty-icon">📦</div><h3>No master orders found</h3></div>'; return; }
    var rows = orders.map(function(o) {
      var progress = o.progress || o.status;
      return '<tr>' +
        '<td><strong>' + escape(o.masterOrderNumber) + '</strong></td>' +
        '<td>' + escape((o.customer && o.customer.name) || o.guestName || '—') + '<br><span style="font-size:11px;color:#9ca3af">' + escape((o.customer && o.customer.phone) || o.guestPhone || '') + '</span></td>' +
        '<td>' + badge(PROGRESS_LABELS[progress] || progress, PROGRESS_COLORS[progress] || 'gray') + '</td>' +
        '<td>' + (o.childOrders ? o.childOrders.length : 0) + '</td>' +
        '<td>' + fmtCur(o.totalAmount) + '</td>' +
        '<td>' + fmtDateShort(o.createdAt) + '</td>' +
        '<td><button class="btn btn-xs btn-outline" onclick="viewDetail(\'' + o.id + '\')">View</button></td>' +
      '</tr>';
    }).join('');
    document.getElementById('tbl').innerHTML = '<table><thead><tr><th>Order #</th><th>Customer</th><th>Progress</th><th>Parts</th><th>Total</th><th>Placed</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
  }).catch(function(e) { document.getElementById('tbl').innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><h3>' + escape(e.message) + '</h3></div>'; });
}

// Flattens child orders into one row per actual item (one per service child order,
// one per product line within a seller's child order) — the admin sees "Item 1..N"
// directly, while the vendor/status/GST/timeline underneath still comes from the real
// child Order each item belongs to.
function _flattenMasterOrderItems(masterOrder) {
  var items = [];
  (masterOrder.childOrders || []).forEach(function(c) {
    if (c.type === 'SERVICE') {
      // Smart Order Grouping: this child order can bundle several same-category services
      // (see OrderServiceItem) — flatten each one to its own row, proportioning GST the
      // same way the PRODUCT branch below already does. Falls back to the single
      // c.service for orders created before this feature (no serviceItems rows).
      var svcLines = (c.serviceItems && c.serviceItems.length) ? c.serviceItems : [{ service: c.service, quantity: 1, totalPrice: c.serviceAmount }];
      var serviceAmount = Number(c.serviceAmount) || 0;
      svcLines.forEach(function(si) {
        var share = serviceAmount > 0 ? (Number(si.totalPrice) / serviceAmount) : (1 / svcLines.length);
        items.push({
          name: (si.service && si.service.name) || 'Service',
          vendor: (c.vendor && c.vendor.user && c.vendor.user.name) || '—',
          status: c.status,
          qty: si.quantity,
          price: si.totalPrice,
          gst: Math.round(Number(c.gstAmount) * share * 100) / 100,
          timeline: c.timeline || [],
          childOrderNumber: c.orderNumber,
        });
      });
    } else {
      var productsAmount = Number(c.productsAmount) || 0;
      (c.items || []).forEach(function(it) {
        var share = productsAmount > 0 ? (Number(it.totalPrice) / productsAmount) : 0;
        items.push({
          name: (it.product && it.product.name) || 'Product',
          vendor: (it.product && it.product.vendor && it.product.vendor.businessName) || '—',
          status: c.status,
          qty: it.quantity,
          price: it.totalPrice,
          gst: Math.round(Number(c.gstAmount) * share * 100) / 100,
          timeline: c.timeline || [],
          childOrderNumber: c.orderNumber,
        });
      });
    }
  });
  return items;
}

function _timelineSummary(timeline) {
  if (!timeline || !timeline.length) return '<span style="color:#9ca3af;font-size:12px">—</span>';
  var last = timeline[timeline.length - 1];
  return '<span style="font-size:12px;color:#6b7280">' + escape(last.status) + ' · ' + fmtDateShort(last.createdAt) + '</span>';
}

function _timelineDetailRows(timeline, colspan) {
  if (!timeline || !timeline.length) return '';
  var rows = timeline.map(function(t) {
    return '<div style="padding:4px 0;font-size:12px;color:#6b7280">' +
      statusBadge(t.status) + ' <span style="margin-left:6px">' + fmtDate(t.createdAt) + '</span>' +
      (t.note ? ' — ' + escape(t.note) : '') +
    '</div>';
  }).join('');
  return '<tr class="tl-detail" style="display:none"><td colspan="' + colspan + '" style="background:#fafafa;padding:8px 12px">' + rows + '</td></tr>';
}

function toggleTimeline(btn) {
  var row = btn.closest('tr').nextElementSibling;
  if (row && row.classList.contains('tl-detail')) {
    row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
  }
}

function viewDetail(id) {
  document.getElementById('detail-overlay').style.display = 'flex';
  document.getElementById('d-number').textContent = '';
  document.getElementById('d-body').innerHTML = 'Loading…';
  api('GET', '/admin/master-orders/' + id).then(function(o) {
    document.getElementById('d-number').textContent = o.masterOrderNumber;
    var progress = o.progress || o.status;
    var html = '<div style="display:flex;justify-content:space-between;margin-bottom:14px">' +
      '<div>' + badge(PROGRESS_LABELS[progress] || progress, PROGRESS_COLORS[progress] || 'gray') + '</div>' +
      '<div style="font-weight:700;color:#c4601a">' + fmtCur(o.totalAmount) + '</div>' +
    '</div>';
    html += '<p style="margin:0 0 12px;font-size:13px;color:#6b7280">' +
      escape((o.customer && o.customer.name) || o.guestName || 'Guest') + ' · ' +
      escape((o.customer && o.customer.phone) || o.guestPhone || '') +
      (o.address ? ' · ' + escape(o.address.fullAddress || '') : '') +
    '</p>';

    var items = _flattenMasterOrderItems(o);
    var colspan = 7;
    html += '<div class="table-wrap"><table><thead><tr>' +
      '<th>Item</th><th>Vendor</th><th>Status</th><th>Qty</th><th>Price</th><th>GST</th><th>Timeline</th>' +
      '</tr></thead><tbody>';
    items.forEach(function(item, i) {
      html += '<tr>' +
        '<td>Item ' + (i + 1) + ': ' + escape(item.name) + '<br><span style="font-size:11px;color:#9ca3af">' + escape(item.childOrderNumber) + '</span></td>' +
        '<td>' + escape(item.vendor) + '</td>' +
        '<td>' + statusBadge(item.status) + '</td>' +
        '<td>' + item.qty + '</td>' +
        '<td>' + fmtCur(item.price) + '</td>' +
        '<td>' + fmtCur(item.gst) + '</td>' +
        '<td><button class="btn btn-xs btn-outline" onclick="toggleTimeline(this)">' + item.timeline.length + ' event(s)</button><br>' + _timelineSummary(item.timeline) + '</td>' +
      '</tr>';
      html += _timelineDetailRows(item.timeline, colspan);
    });
    html += '</tbody></table></div>';
    document.getElementById('d-body').innerHTML = html;
  }).catch(function(e) {
    document.getElementById('d-body').innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><h3>' + escape(e.message) + '</h3></div>';
  });
}

load();
</script>
</body>
</html>
