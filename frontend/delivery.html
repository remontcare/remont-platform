<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Delivery Partner App – Remont India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sienna:#C4601A; --amber:#E8A650; --ivory:#FDFAF5; --cream:#F5F0E8;
  --charcoal:#1A1A1A; --mist:#E8E3DA; --white:#fff;
  --success:#22c55e; --error:#ef4444; --blue:#3b82f6;
  --ff-body:"DM Sans",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ff-body);background:var(--cream);color:var(--charcoal);min-height:100vh}
button{cursor:pointer;font-family:var(--ff-body);border:none;outline:none}
input{font-family:var(--ff-body)}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--ivory);box-shadow:0 0 60px rgba(0,0,0,.08)}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}
.auth-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 28px}
.auth-logo-icon{width:44px;height:44px;background:var(--sienna);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:700;margin:0 auto 16px}
.auth-title{font-size:24px;font-weight:800;text-align:center;margin-bottom:6px}
.auth-sub{font-size:13px;color:#6b7280;text-align:center;margin-bottom:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;color:#374151;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.field input{width:100%;padding:14px 16px;border:1.5px solid var(--mist);border-radius:10px;font-size:15px;background:#fff}
.field input:focus{outline:none;border-color:var(--sienna)}
.btn-primary{width:100%;padding:15px;background:var(--sienna);color:#fff;border-radius:12px;font-size:15px;font-weight:700}
.btn-primary:disabled{background:#d1d5db}
.btn-outline{padding:10px 16px;border:1.5px solid var(--mist);border-radius:10px;font-size:13px;font-weight:600;color:#374151;background:#fff}
.link{text-align:center;font-size:13px;color:var(--sienna);margin-top:14px;display:block;cursor:pointer}
.auth-error{font-size:13px;color:var(--error);text-align:center;margin-bottom:10px;min-height:16px}
.app-header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--mist);padding:14px 18px;display:flex;align-items:center;gap:12px}
.app-header .name{flex:1;font-size:14px;font-weight:700}
.app-header .sub{font-size:11px;color:#9ca3af}
.pill{display:flex;align-items:center;gap:8px;background:var(--cream);border-radius:20px;padding:6px 6px 6px 12px}
.pill .lbl{font-size:11px;font-weight:700;color:#6b7280}
.pill.on .lbl{color:var(--success)}
.content{flex:1;padding:16px}
.card{background:#fff;border:1px solid var(--mist);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card .top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.card .track{font-size:13px;font-weight:700}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge.ASSIGNED{background:#dbeafe;color:#1d4ed8}
.badge.PICKED_UP{background:#fef3c7;color:#92400e}
.badge.IN_TRANSIT{background:#ede9fe;color:#6d28d9}
.badge.DELIVERED{background:#dcfce7;color:#15803d}
.badge.FAILED{background:#fee2e2;color:#b91c1c}
.card .addr{font-size:13px;color:#374151;margin:6px 0}
.card .actions{display:flex;gap:8px;margin-top:8px}
.card .actions button{flex:1;padding:8px;border-radius:8px;font-size:12px;font-weight:700}
.empty{text-align:center;padding:50px 20px;color:#9ca3af;font-size:14px}
.otp-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center;padding:20px}
.otp-modal-overlay.active{display:flex}
.otp-modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:340px;text-align:center}
.otp-modal h3{font-size:16px;font-weight:800;margin-bottom:6px}
.otp-modal p{font-size:13px;color:#6b7280;margin-bottom:18px}
.otp-digit-row{display:flex;gap:10px;justify-content:center;margin-bottom:8px}
.otp-digit-row input{width:46px;height:54px;text-align:center;font-size:22px;font-weight:800;border:1.5px solid var(--mist);border-radius:10px}
.otp-digit-row input:focus{outline:none;border-color:var(--sienna)}
.otp-modal-err{font-size:12px;color:var(--error);min-height:16px;margin-bottom:10px}
.otp-modal .actions{display:flex;gap:10px;margin-top:6px}
.otp-modal .actions button{flex:1;padding:12px;border-radius:10px;font-size:13px;font-weight:700}
</style>
</head>
<body>
<div class="app">

  <div id="screen-login" class="screen active">
    <div class="auth-wrap">
      <div class="auth-logo-icon">🚚</div>
      <div class="auth-title">Delivery Partner</div>
      <div class="auth-sub">Remont India — Sign in with your mobile number</div>
      <div class="auth-error" id="login-err"></div>

      <div id="login-phone-step">
        <div class="field"><label>Mobile Number</label><input id="login-phone" type="tel" maxlength="10" placeholder="10-digit mobile number"></div>
        <button class="btn-primary" id="send-otp-btn" onclick="sendLoginOtp()">Send OTP →</button>
      </div>
      <div id="login-otp-step" style="display:none">
        <div class="auth-sub" id="otp-sent-to" style="margin-bottom:14px"></div>
        <div class="field"><label>Enter OTP</label><input id="login-otp" type="text" inputmode="numeric" maxlength="6" placeholder="6-digit OTP"></div>
        <button class="btn-primary" id="verify-otp-btn" onclick="verifyLoginOtp()">Verify & Continue</button>
        <span class="link" onclick="backToPhone()">← Change number</span>
      </div>
    </div>
  </div>

  <div id="screen-app" class="screen">
    <div class="app-header">
      <div><div class="name" id="hdr-name">Partner</div><div class="sub" id="hdr-sub">Delivery Partner</div></div>
      <div class="pill" id="online-pill"><span class="lbl" id="online-label">Location Off</span>
        <input type="checkbox" id="online-toggle" onchange="toggleLocationSharing(this.checked)" style="margin-left:4px">
      </div>
      <button class="btn-outline" onclick="doLogout()">Logout</button>
    </div>
    <div class="content">
      <div id="list" class="loading">Loading…</div>
    </div>
  </div>

</div>

<!-- Delivery OTP verification — asked only when marking an order DELIVERED, so a delivery
     can't be closed out without the customer actually present to hand it off. -->
<div class="otp-modal-overlay" id="otp-modal-overlay">
  <div class="otp-modal">
    <h3>Verify Delivery OTP</h3>
    <p>Ask the customer for the 4-digit OTP shown on their order screen.</p>
    <div class="otp-digit-row">
      <input maxlength="1" inputmode="numeric" id="dotp-0" oninput="dOtpJump(0)">
      <input maxlength="1" inputmode="numeric" id="dotp-1" oninput="dOtpJump(1)">
      <input maxlength="1" inputmode="numeric" id="dotp-2" oninput="dOtpJump(2)">
      <input maxlength="1" inputmode="numeric" id="dotp-3" oninput="dOtpJump(3)">
    </div>
    <div class="otp-modal-err" id="dotp-err"></div>
    <div class="actions">
      <button class="btn-outline" onclick="closeOtpModal()">Cancel</button>
      <button class="btn-primary" id="dotp-confirm-btn" onclick="confirmDeliveryOtp()">Confirm Delivery</button>
    </div>
  </div>
</div>

<script src="/shared/remont-auth.js"></script>
<script>
var pendingPhone = '';
var locWatchId = null;

function backToPhone(){
  document.getElementById('login-otp-step').style.display='none';
  document.getElementById('login-phone-step').style.display='block';
}

function sendLoginOtp(){
  var digits = document.getElementById('login-phone').value.replace(/\D/g,'');
  var err = document.getElementById('login-err'); err.textContent='';
  if (digits.length !== 10) { err.textContent='Enter a valid 10-digit mobile number'; return; }
  pendingPhone = '+91'+digits;
  var btn = document.getElementById('send-otp-btn'); btn.disabled=true; btn.textContent='Sending…';
  RemontAuth.sendOtp(pendingPhone).then(function(){
    document.getElementById('otp-sent-to').textContent = 'OTP sent to ' + pendingPhone;
    document.getElementById('login-phone-step').style.display='none';
    document.getElementById('login-otp-step').style.display='block';
    document.getElementById('login-otp').focus();
  }).catch(function(e){ err.textContent = e.message; })
  .then(function(){ btn.disabled=false; btn.textContent='Send OTP →'; });
}

function verifyLoginOtp(){
  var otp = document.getElementById('login-otp').value.trim();
  var err = document.getElementById('login-err'); err.textContent='';
  if (!otp) { err.textContent='Enter the OTP'; return; }
  var btn = document.getElementById('verify-otp-btn'); btn.disabled=true; btn.textContent='Verifying…';
  RemontAuth.verifyOtp(pendingPhone, otp).then(function(res){
    if (res.user.role !== 'DELIVERY_PARTNER') {
      RemontAuth.clearSession();
      throw new Error('This number is registered as ' + res.user.role.toLowerCase().replace('_',' ') + ', not a delivery partner.');
    }
    document.getElementById('hdr-name').textContent = res.user.name || 'Partner';
    showScreen('screen-app');
    loadDeliveries();
  }).catch(function(e){ err.textContent = e.message; })
  .then(function(){ btn.disabled=false; btn.textContent='Verify & Continue'; });
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

function doLogout(){
  stopLocationSharing();
  RemontAuth.clearSession();
  showScreen('screen-login');
  document.getElementById('login-phone-step').style.display='block';
  document.getElementById('login-otp-step').style.display='none';
}

function fmtDate(d){ return d ? new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '—'; }

function loadDeliveries(){
  RemontAuth.apiFetch('/delivery/me/deliveries').then(function(list){
    if (!list || !list.length) { document.getElementById('list').innerHTML = '<div class="empty">No deliveries assigned yet</div>'; return; }
    document.getElementById('list').innerHTML = list.map(function(d){
      var nextAction = { ASSIGNED: ['PICKED_UP','Mark Picked Up'], PICKED_UP: ['IN_TRANSIT','Start Transit'], IN_TRANSIT: ['DELIVERED','Mark Delivered'] }[d.status];
      return '<div class="card">' +
        '<div class="top-row"><span class="track">#' + d.trackingNumber + '</span><span class="badge ' + d.status + '">' + d.status.replace('_',' ') + '</span></div>' +
        '<div class="addr">📍 ' + (d.dropAddress || '') + '</div>' +
        '<div class="addr" style="color:#9ca3af;font-size:12px">' + fmtDate(d.createdAt) + ' · ₹' + (d.earningAmount||0) + ' earning</div>' +
        (nextAction ? '<div class="actions"><button class="btn-primary" style="background:var(--sienna);color:#fff" onclick="updateStatus(\'' + d.id + '\',\'' + nextAction[0] + '\')">' + nextAction[1] + '</button></div>' : '') +
      '</div>';
    }).join('');
  }).catch(function(e){
    document.getElementById('list').innerHTML = '<div class="empty">' + e.message + '</div>';
  });
}

function updateStatus(id, status){
  if (status === 'DELIVERED') { openOtpModal(id); return; }
  RemontAuth.apiFetch('/delivery/' + id + '/status', { method:'PATCH', body: JSON.stringify({ status: status }) })
    .then(loadDeliveries)
    .catch(function(e){ alert(e.message); });
}

var _otpDeliveryId = null;
function openOtpModal(id){
  _otpDeliveryId = id;
  ['0','1','2','3'].forEach(function(i){ var el=document.getElementById('dotp-'+i); el.value=''; el.classList.remove('filled'); });
  document.getElementById('dotp-err').textContent = '';
  var btn = document.getElementById('dotp-confirm-btn'); btn.disabled = false; btn.textContent = 'Confirm Delivery';
  document.getElementById('otp-modal-overlay').classList.add('active');
  setTimeout(function(){ document.getElementById('dotp-0').focus(); }, 50);
}
function closeOtpModal(){
  document.getElementById('otp-modal-overlay').classList.remove('active');
  _otpDeliveryId = null;
}
function dOtpJump(i){
  var el = document.getElementById('dotp-'+i);
  if (el.value) { var n = document.getElementById('dotp-'+(i+1)); if (n) n.focus(); }
}
function confirmDeliveryOtp(){
  var code = ['0','1','2','3'].map(function(i){ return document.getElementById('dotp-'+i).value; }).join('');
  var errEl = document.getElementById('dotp-err'); errEl.textContent = '';
  if (code.length !== 4) { errEl.textContent = 'Enter the 4-digit OTP'; return; }
  var btn = document.getElementById('dotp-confirm-btn'); btn.disabled = true; btn.textContent = 'Verifying…';
  RemontAuth.apiFetch('/delivery/' + _otpDeliveryId + '/status', { method:'PATCH', body: JSON.stringify({ status: 'DELIVERED', otp: code }) })
    .then(function(){ closeOtpModal(); loadDeliveries(); })
    .catch(function(e){ errEl.textContent = e.message || 'Invalid OTP'; btn.disabled = false; btn.textContent = 'Confirm Delivery'; });
}

function toggleLocationSharing(on){
  if (on) startLocationSharing(); else stopLocationSharing();
}

function startLocationSharing(){
  if (!navigator.geolocation) { alert('Location not supported on this device'); document.getElementById('online-toggle').checked = false; return; }
  document.getElementById('online-pill').classList.add('on');
  document.getElementById('online-label').textContent = 'Location On';
  locWatchId = navigator.geolocation.watchPosition(function(pos){
    RemontAuth.apiFetch('/delivery/me/location', { method:'PATCH', body: JSON.stringify({ lat: pos.coords.latitude, lng: pos.coords.longitude }) }).catch(function(){});
  }, function(){}, { enableHighAccuracy: true, maximumAge: 30000 });
}

function stopLocationSharing(){
  if (locWatchId !== null && navigator.geolocation) navigator.geolocation.clearWatch(locWatchId);
  locWatchId = null;
  document.getElementById('online-pill').classList.remove('on');
  document.getElementById('online-label').textContent = 'Location Off';
  document.getElementById('online-toggle').checked = false;
}

if (RemontAuth.getToken()) {
  RemontAuth.apiFetch('/auth/me').then(function(me){
    if (me.role !== 'DELIVERY_PARTNER') { doLogout(); return; }
    document.getElementById('hdr-name').textContent = me.name || 'Partner';
    showScreen('screen-app');
    loadDeliveries();
  }).catch(function(){ doLogout(); });
}
</script>
</body>
</html>
