<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1D4ED8" />
<meta name="robots" content="noindex" />
<title>You're offline | Remont India</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fff; color: #0F172A; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 22px; margin: 20px 0 8px; }
  p { color: #475467; font-size: 15px; line-height: 1.5; margin: 0 0 24px; max-width: 320px; }
  button { background: #C2410C; color: #fff; border: 0; border-radius: 12px; padding: 14px 32px; font-size: 16px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="Remont India" />
    <h1>You're offline</h1>
    <p>Prices, bookings and orders need an internet connection. Please reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
