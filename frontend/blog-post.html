<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="page-title">Blog | Remont India</title>
<meta id="meta-desc" name="description" content="Remont India blog article." />
<meta name="robots" content="index, follow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet" />
<style>
:root{--cream:#F5F0E8;--ivory:#FDFAF5;--charcoal:#1A1A1A;--graphite:#2D2D2D;--sienna:#C4601A;--amber:#E8A650;--mist:#E8E3DA;--txt-muted:#6E6860;--radius:12px;--ff-display:"Cormorant Garamond",Georgia,serif;--ff-body:"DM Sans",sans-serif;--ff-accent:"Bebas Neue",sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ff-body);background:var(--ivory);color:var(--charcoal);line-height:1.75;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:var(--sienna)}
.wrap{max-width:760px;margin:0 auto;padding:0 24px}
header.site{background:var(--charcoal);color:#fff;padding:16px 0}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.brand{font-family:var(--ff-accent);font-size:22px;letter-spacing:.5px;color:#fff}
.brand span{color:var(--amber)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:100px;font-weight:600;font-size:13px}
.btn-outline{border:1.5px solid rgba(255,255,255,.4);color:#fff}
nav.crumbs{font-size:12.5px;color:var(--txt-muted);padding:14px 0}
article{padding:24px 0 48px}
article img.cover{width:100%;max-height:360px;object-fit:cover;border-radius:var(--radius);margin-bottom:20px}
article h1{font-family:var(--ff-display);font-size:clamp(26px,4vw,38px);font-weight:600;margin-bottom:10px}
article .meta{font-size:12.5px;color:var(--sienna);font-weight:600;margin-bottom:20px}
article .content{color:var(--graphite);font-size:15.5px}
article .content p{margin-bottom:14px}
footer.site{background:var(--charcoal);color:rgba(255,255,255,.65);padding:32px 0;font-size:13px;text-align:center}
footer.site a{color:var(--amber)}
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a href="/" class="brand">Remont <span>India</span></a>
    <a href="tel:+919876543210" class="btn btn-outline">📞 Call</a>
  </div>
</header>
<nav class="crumbs"><div class="wrap"><a href="/">Home</a> / <a href="/blog">Blog</a> / <span id="crumb-title">Article</span></div></nav>

<article><div class="wrap" id="post-body">
  <p style="color:var(--txt-muted)">Loading article…</p>
</div></article>

<footer class="site">
  <div class="wrap">
    <p>© 2026 Remont India Technologies Pvt. Ltd. · <a href="/">Home</a> · <a href="/blog">All Articles</a> · <a href="/contact">Contact</a></p>
  </div>
</footer>

<script>
  var API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:3001' : '';
  function escHtml(s) {
    return (s == null ? '' : String(s)).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  var slug = new URLSearchParams(window.location.search).get('slug');
  var body = document.getElementById('post-body');
  if (!slug) {
    body.innerHTML = '<p>No article specified. <a href="/blog">Back to Blog</a></p>';
  } else {
    fetch(API_BASE + '/api/v1/cms/blogs/' + encodeURIComponent(slug))
      .then(function(r) { return r.json(); })
      .then(function(res) {
        var p = res && res.data ? res.data : res;
        if (!p || !p.title) {
          body.innerHTML = '<p>This article could not be found. <a href="/blog">Back to Blog</a></p>';
          return;
        }
        document.getElementById('page-title').textContent = p.title + ' | Remont India Blog';
        if (p.summary) document.getElementById('meta-desc').setAttribute('content', p.summary);
        document.getElementById('crumb-title').textContent = p.title;
        var date = p.publishedAt ? new Date(p.publishedAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
        var img = p.imageUrl ? '<img class="cover" src="' + escHtml(p.imageUrl) + '" alt="' + escHtml(p.title) + '">' : '';
        var contentHtml = (p.content || '').split(/\n{2,}/).map(function(para) { return '<p>' + escHtml(para) + '</p>'; }).join('');
        body.innerHTML = img + '<h1>' + escHtml(p.title) + '</h1>' +
          '<div class="meta">' + escHtml(p.author || 'Remont Team') + (date ? ' · ' + date : '') + '</div>' +
          '<div class="content">' + contentHtml + '</div>';
      })
      .catch(function() {
        body.innerHTML = '<p>Couldn\'t load this article right now. <a href="/blog">Back to Blog</a></p>';
      });
  }
</script>
</body>
</html>
