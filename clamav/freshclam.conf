# freshclam.conf — signature-database updater for the Remont India ClamAV service.
# DatabaseDirectory MUST match the Railway Volume mount path on this service, or updates
# are lost on every restart and the database re-downloads from scratch each time (slow, and
# risks hitting ClamAV's public mirror rate limits).
DatabaseDirectory /var/lib/clamav

# DEPLOYMENT FIX (verified against a real deploy): same "Symbolic link loop" issue as
# clamd.conf's LogFile — no UpdateLogFile directive means freshclam logs straight to the
# console instead, which Railway still captures.

DatabaseMirror database.clamav.net

# Times per day freshclam checks for updates against the mirror's published version.
Checks 24
