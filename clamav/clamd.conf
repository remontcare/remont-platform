# clamd.conf — Remont India upload-scanning service.
# Overrides the clamav/clamav base image's defaults. Every value below is deliberate for
# this specific deployment — read the comment before changing one.

# The base image's entrypoint supervises clamd directly; it must stay attached to the
# foreground so Docker/Railway can track the process and restart policy works correctly.
Foreground true

# Ephemeral container filesystem — log to stdout so Railway's log aggregation actually
# captures it, instead of a file that disappears on restart.
LogFile /dev/stdout
LogTime yes
LogVerbose no

# TCP only, bound on all interfaces. This service exists solely to be reached from the
# backend over Railway's private network — 127.0.0.1-only binding would make it unreachable
# from any other container, defeating the entire point.
TCPSocket 3310
TCPAddr 0.0.0.0

# No local UNIX socket — nothing connects to this daemon from inside its own container;
# every caller is a separate service reaching it over TCP.
LocalSocket disable

# MUST exceed the largest allowed upload (backend's 50MB video cap) or clamd truncates/
# rejects the scan outright — this is the single easiest ClamAV setting to get wrong for
# this project. Given headroom above 50MB.
StreamMaxLength 60M
MaxFileSize 60M

# Bounded concurrency — each scanning thread adds its own memory overhead on top of the
# ~1GB+ already needed for the loaded signature database. Keep modest rather than unbounded;
# tune against the service's actual allocated RAM once real traffic patterns are known.
MaxThreads 12
MaxConnectionQueueLength 30

# Server-side timeout for a stalled/slow stream — coordinated with (kept below) the
# backend's own CLAMAV_SCAN_TIMEOUT_MS (default 20s) client-side timeout.
ReadTimeout 25

DatabaseDirectory /var/lib/clamav
