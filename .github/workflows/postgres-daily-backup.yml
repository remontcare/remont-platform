name: Postgres Daily Backup

on:
  schedule:
    # 21:30 UTC = 3:00 AM IST daily
    - cron: '30 21 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump PostgreSQL database
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "RAILWAY_BACKUP_DATABASE_URL secret is not set. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p backups
          TIMESTAMP=$(date -u +'%Y-%m-%d_%H-%M-%S')
          docker run --rm postgres:18 pg_dump "$DATABASE_URL" | gzip > "backups/backup_${TIMESTAMP}.sql.gz"
          echo "Dump size:"
          du -h backups/backup_${TIMESTAMP}.sql.gz

      - name: Verify backup is not empty
        run: |
          set -euo pipefail
          FILE=$(ls backups/*.sql.gz)
          SIZE=$(stat -c%s "$FILE")
          if [ "$SIZE" -lt 200 ]; then
            echo "Backup file looks too small ($SIZE bytes) - failing the job so it gets noticed."
            exit 1
          fi

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgres-backup-${{ github.run_id }}
          path: backups/*.sql.gz
          retention-days: 30
